<!DOCTYPE html>
<html>
<head>
<title>Login - CityCare</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="images/logo.png">

<style>
body{
font-family:'Segoe UI';
background:linear-gradient(135deg,#5a63d8,#00c6ff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
width:350px;
background:white;
padding:30px;
border-radius:12px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{margin-bottom:20px;}

.input-box{
position:relative;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

.toggle{
position:absolute;
right:10px;
top:18px;
cursor:pointer;
color:#555;
}

button{
width:100%;
padding:12px;
background:#5a63d8;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:disabled{
background:#aaa;
}

.error{
color:red;
display:none;
margin-top:10px;
font-size:14px;
}

.loader{
display:none;
margin-top:10px;
color:#555;
}

.link{
margin-top:10px;
display:block;
color:#5a63d8;
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h2>User Login</h2>

<input type="email" id="email" placeholder="Email">

<div class="input-box">
<input type="password" id="password" placeholder="Password">
<i class="fas fa-eye toggle" onclick="togglePassword()"></i>
</div>

<button id="btn" onclick="login()">Login</button>

<p class="loader" id="loader">Logging in...</p>
<p class="error" id="errorMsg"></p>

<a href="signup.html" class="link">Create Account</a>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>

/* ✅ UPDATED CONFIG (YOUR NEW PROJECT) */
const firebaseConfig = {
  apiKey: "AIzaSyBgpOLahDrFHB32QJu_Z7OwGhI90jB9jGE",
  authDomain: "citycare-vishnu-2026.firebaseapp.com",
  projectId: "citycare-vishnu-2026",
  storageBucket: "citycare-vishnu-2026.firebasestorage.app",
  messagingSenderId: "123554182061",
  appId: "1:123554182061:web:b06db741f262adac67a724"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* SESSION */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* AUTO REDIRECT (IF ALREADY LOGGED IN) */
auth.onAuthStateChanged(user=>{
if(user){
window.location.href="dashboard.html";
}
});

/* ENTER KEY */
document.addEventListener("keypress", function(e){
if(e.key === "Enter"){
login();
}
});

/* PASSWORD TOGGLE */
function togglePassword(){
let pass = document.getElementById("password");
pass.type = pass.type === "password" ? "text" : "password";
}

/* LOGIN FUNCTION */
function login(){

let email=document.getElementById("email").value.trim();
let pass=document.getElementById("password").value.trim();
let error=document.getElementById("errorMsg");
let loader=document.getElementById("loader");
let btn=document.getElementById("btn");

error.style.display="none";

/* VALIDATION */
if(email===""||pass===""){
error.innerText="Please fill all fields!";
error.style.display="block";
return;
}

/* UI */
loader.style.display="block";
btn.disabled=true;

/* FIREBASE LOGIN */
auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
window.location.href="dashboard.html";
})
.catch(err=>{

if(err.code==="auth/user-not-found"){
error.innerText="User not found";
}
else if(err.code==="auth/wrong-password"){
error.innerText="Incorrect password";
}
else if(err.code==="auth/invalid-email"){
error.innerText="Invalid email format";
}
else{
error.innerText="Login failed. Try again.";
}

error.style.display="block";

})
.finally(()=>{
loader.style.display="none";
btn.disabled=false;
});

}

</script>

</body>
</html>
