<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact - CityCare</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="images/logo.png">
<style>

body {
    font-family: 'Segoe UI';
    background: #f4f6fb;
    margin: 0;
}

/* NAV */
nav {
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    background:#0b132b;
    color:white;
}

.nav-links a{
    color:white;
    margin-left:20px;
    text-decoration:none;
}
.nav-links a:hover{color:#00c6ff;}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 50px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

/* CARD */
.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* INPUT */
input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* BUTTON */
button {
    padding: 12px;
    background: #5a63d8;
    color: white;
    border: none;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
    font-weight:600;
}

/* INFO */
.info p {
    margin: 12px 0;
    color:#444;
}

.info i{
    color:#5a63d8;
    margin-right:8px;
}

/* MAP */
iframe {
    width: 100%;
    height: 220px;
    border: none;
    border-radius: 10px;
    margin-top:15px;
}

/* SUCCESS */
.success {
    color: green;
    display: none;
    margin-top: 10px;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    font-size: 22px;
    width: 50px;
    height: 50px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius: 50%;
}

/* RESPONSIVE */
@media(max-width:768px){
.container{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
<div>CityCare</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="doctors.html">Doctors</a>
</div>
</nav>

<div class="container">

<!-- FORM -->
<div class="card">
<h2>Contact Us</h2>

<input type="text" id="name" placeholder="Your Name">
<input type="email" id="email" placeholder="Email">
<textarea id="message" placeholder="Your Message"></textarea>

<button onclick="send()">Send Message</button>

<p class="success" id="successMsg">✅ Message sent successfully!</p>

</div>

<!-- INFO -->
<div class="card info">
<h2>Contact Information</h2>

<p><i class="fas fa-map-marker-alt"></i> Hyderabad, India</p>
<p><i class="fas fa-phone"></i> +91 9876543210</p>
<p><i class="fas fa-envelope"></i> citycare@gmail.com</p>

<h3>Our Location</h3>

<iframe src="https://maps.google.com/maps?q=hyderabad&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

</div>

</div>

<!-- WHATSAPP -->
<a href="https://wa.me/919876543210" target="_blank" class="whatsapp">
<i class="fab fa-whatsapp"></i>
</a>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB8j22iqUKnnuRrvA9HlbgEL_uPJTL_W_0",
  authDomain: "citycare-hospital-e071d.firebaseapp.com",
  projectId: "citycare-hospital-e071d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* SEND MESSAGE */
function send(){

let name = document.getElementById("name").value.trim();
let email = document.getElementById("email").value.trim();
let message = document.getElementById("message").value.trim();

if(name===""||email===""||message===""){
alert("Please fill all fields!");
return;
}

/* SAVE TO FIRESTORE */
db.collection("messages").add({
name,
email,
message,
createdAt:new Date()
})
.then(()=>{

document.getElementById("successMsg").style.display="block";

/* RESET */
document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("message").value="";

});

}

</script>

</body>
</html>
